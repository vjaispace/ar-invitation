<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Wedding Invitation</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin:0; overflow:hidden; }

.btn-circle {
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
}

#arBtn { background:#d4af37; color:white; }
#webBtn { background:white; color:black; }
</style>

</head>

<body>

<!-- OVERLAY -->
<div id="overlay" style="
position:fixed;
top:0; left:0;
width:100%; height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
z-index:9999;
gap:20px;">

<button id="arBtn" class="btn-circle">AR</button>
<button id="webBtn" class="btn-circle">Website</button>

</div>

<a-scene id="scene" visible="false"
xr-mode-ui="enabled: false"
cursor="rayOrigin: mouse"
raycaster="objects: .clickable">

<a-assets>

<video id="video"
src="invitation.mp4"
loop muted playsinline webkit-playsinline
crossorigin="anonymous" preload="auto">
</video>

<img id="petal" src="petal.png">
<img id="bg" src="bg.jpeg">

</a-assets>

<a-camera position="0 1.6 0">

<a-entity position="0 -0.55 -1">

<a-circle id="btn" class="clickable"
radius="0.08" color="#fff" opacity="0.6"></a-circle>

<a-triangle id="playIcon"
visible="false"
color="#000"
vertex-a="0.03 0 0"
vertex-b="-0.02 0.03 0"
vertex-c="-0.02 -0.03 0"
position="0 0 0.01"></a-triangle>

<a-box id="bar1" width="0.01" height="0.05" depth="0.01"
color="#000" position="-0.015 0 0.01"></a-box>

<a-box id="bar2" width="0.01" height="0.05" depth="0.01"
color="#000" position="0.015 0 0.01"></a-box>

</a-entity>

</a-camera>

<a-sky src="#bg"></a-sky>

<a-light type="ambient" intensity="1.2"></a-light>
<a-light type="point" position="0 3 -2" intensity="2"></a-light>

<a-entity position="0 1.6 -3">
<a-video src="#video" width="1.5" height="2.7" material="shader: flat"></a-video>
</a-entity>

<a-entity id="petals"></a-entity>

</a-scene>

<script>

const video = document.querySelector("#video");
const overlay = document.querySelector("#overlay");
const scene = document.querySelector("#scene");

const arBtn = document.querySelector("#arBtn");
const webBtn = document.querySelector("#webBtn");

const btn = document.querySelector("#btn");
const playIcon = document.querySelector("#playIcon");
const bar1 = document.querySelector("#bar1");
const bar2 = document.querySelector("#bar2");

let isARMode = false;

/* START */
arBtn.onclick = async () => {

overlay.style.display = "none";
scene.setAttribute("visible", "true");

try {
video.muted = true;
await video.play();
setTimeout(()=> video.muted=false,500);
} catch {
alert("Tap again");
}

};

/* WEBSITE */
webBtn.onclick = () => {
window.open("https://s-weds-r.my.canva.site/", "_blank");
};

/* TOGGLE */
function toggle(){

if(video.paused){
video.play();
playIcon.setAttribute("visible", false);
bar1.setAttribute("visible", true);
bar2.setAttribute("visible", true);
}else{
video.pause();
playIcon.setAttribute("visible", true);
bar1.setAttribute("visible", false);
bar2.setAttribute("visible", false);
}

}

/* MOBILE BUTTON (UNCHANGED) */
btn.addEventListener("click", toggle);
playIcon.addEventListener("click", toggle);
bar1.addEventListener("click", toggle);
bar2.addEventListener("click", toggle);

/* 🔥 AR MODE DETECTION */
scene.addEventListener("enter-vr", () => {

isARMode = true;

const canvas = scene.renderer.domElement;

/* TAP ANYWHERE ONLY IN AR */
canvas.addEventListener("touchstart", (e) => {

/* prevent double trigger from button */
if(e.target.closest(".a-canvas")) {
toggle();
}

});

});

/* PETALS */
const petals = document.querySelector("#petals");

for(let i=0;i<35;i++){
let p=document.createElement("a-image");

p.setAttribute("src","#petal");
p.setAttribute("scale","0.15 0.15 0.15");

p.setAttribute("position",{
x:(Math.random()*4)-2,
y:3+Math.random()*2,
z:-2-Math.random()*2
});

p.setAttribute("animation",{
property:"position",
to:`${(Math.random()*3)-1.5} -1 ${-2-Math.random()*2}`,
dur:4000+Math.random()*2000,
loop:true
});

petals.appendChild(p);
}

</script>

</body>
</html>
