<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Wedding Invitation</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin:0; overflow:hidden; }

.btn-circle {
  width:120px;
  height:120px;
  border-radius:50%;
  font-size:16px;
  border:none;
  display:flex;
  justify-content:center;
  align-items:center;
}

#arBtn {
  background:#d4af37;
  color:white;
}

#webBtn {
  background:white;
  color:black;
}
</style>

</head>

<body>

<!-- OVERLAY -->
<div id="overlay" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
z-index:9999;
gap:20px;
">

<button id="arBtn" class="btn-circle">AR</button>
<button id="webBtn" class="btn-circle">Website</button>

</div>

<!-- SCENE -->
<a-scene 
  id="scene" 
  visible="false"
  xr-mode-ui="enabled: false"
  raycaster="objects: .clickable"
>

<a-assets>

<video id="video"
src="invitation.mp4"
loop
muted
playsinline
webkit-playsinline
crossorigin="anonymous"
preload="auto">
</video>

<img id="petal" src="petal.png">
<img id="bg" src="bg.jpeg">

</a-assets>

<!-- CAMERA + CURSOR -->
<a-camera position="0 1.6 0" cursor="rayOrigin: entity">

  <!-- UI BUTTON -->
  <a-entity position="0 -0.6 -1">

    <!-- BACK -->
    <a-circle
      id="pauseBtn"
      class="clickable"
      radius="0.15"
      color="#ffffff"
      opacity="0.6">
    </a-circle>

    <!-- PLAY ICON -->
    <a-triangle
      id="playIcon"
      class="clickable"
      visible="false"
      color="#000"
      vertex-a="0.06 0 0"
      vertex-b="-0.04 0.05 0"
      vertex-c="-0.04 -0.05 0"
      rotation="0 0 0"
      position="0 0 0.01">
    </a-triangle>

    <!-- PAUSE ICON -->
    <a-box
      id="bar1"
      class="clickable"
      width="0.02"
      height="0.08"
      depth="0.01"
      color="#000"
      position="-0.03 0 0.01">
    </a-box>

    <a-box
      id="bar2"
      class="clickable"
      width="0.02"
      height="0.08"
      depth="0.01"
      color="#000"
      position="0.03 0 0.01">
    </a-box>

  </a-entity>

</a-camera>

<!-- BACKGROUND -->
<a-sky src="#bg"></a-sky>

<a-light type="ambient" intensity="1.2"></a-light>
<a-light type="point" position="0 3 -2" intensity="2"></a-light>

<!-- VIDEO -->
<a-entity position="0 1.6 -3">
  <a-video src="#video" width="1.5" height="2.7" material="shader: flat"></a-video>
</a-entity>

<!-- PETALS -->
<a-entity id="petals"></a-entity>

</a-scene>

<script>

const video = document.querySelector("#video");
const overlay = document.querySelector("#overlay");
const scene = document.querySelector("#scene");

const arBtn = document.querySelector("#arBtn");
const webBtn = document.querySelector("#webBtn");

/* START */
arBtn.onclick = async () => {

  overlay.style.display = "none";
  scene.setAttribute("visible", "true");

  try {
    video.muted = true;
    await video.play();

    setTimeout(()=> video.muted=false,500);

  } catch {
    alert("Tap again");
  }
};

/* WEBSITE */
webBtn.onclick = () => {
  window.open("https://s-weds-r.my.canva.site/", "_blank");
};

/* CONTROLS */
const pauseBtn = document.querySelector("#pauseBtn");
const playIcon = document.querySelector("#playIcon");
const bar1 = document.querySelector("#bar1");
const bar2 = document.querySelector("#bar2");

function toggle(){

  if(video.paused){
    video.play();
    playIcon.setAttribute("visible", false);
    bar1.setAttribute("visible", true);
    bar2.setAttribute("visible", true);
  } else {
    video.pause();
    playIcon.setAttribute("visible", true);
    bar1.setAttribute("visible", false);
    bar2.setAttribute("visible", false);
  }
}

/* KEY FIX: use mousedown + touchstart */
["mousedown","touchstart"].forEach(evt=>{
  pauseBtn.addEventListener(evt, toggle);
  playIcon.addEventListener(evt, toggle);
  bar1.addEventListener(evt, toggle);
  bar2.addEventListener(evt, toggle);
});

/* PETALS */
const petals = document.querySelector("#petals");

for(let i=0;i<35;i++){

  let p=document.createElement("a-image");

  p.setAttribute("src","#petal");
  p.setAttribute("scale","0.15 0.15 0.15");

  p.setAttribute("position",{
    x:(Math.random()*4)-2,
    y:3+Math.random()*2,
    z:-2-Math.random()*2
  });

  p.setAttribute("animation",{
    property:"position",
    to:`${(Math.random()*3)-1.5} -1 ${-2-Math.random()*2}`,
    dur:4000+Math.random()*2000,
    loop:true
  });

  petals.appendChild(p);
}

</script>

</body>
</html>
