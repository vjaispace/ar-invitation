<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Wedding Invitation</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body { margin:0; overflow:hidden; }

/* ROUND BUTTON STYLE */
.btn-circle {
  width:120px;
  height:120px;
  border-radius:50%;
  font-size:16px;
  border:none;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* AR BUTTON */
#arBtn {
  background:#d4af37;
  color:white;
  box-shadow:0 0 20px rgba(212,175,55,0.6);
}

/* WEBSITE BUTTON */
#webBtn {
  background:white;
  color:black;
  box-shadow:0 0 15px rgba(255,255,255,0.5);
}
</style>

</head>

<body>

<!-- OVERLAY -->
<div id="overlay" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
z-index:9999;
gap:20px;
">

<button id="arBtn" class="btn-circle">AR</button>
<button id="webBtn" class="btn-circle">Website</button>

</div>

<!-- SCENE -->
<a-scene 
  id="scene" 
  visible="false"
  xr-mode-ui="enabled: false"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable"
>

<a-assets>

<video id="video"
src="invitation.mp4"
loop
muted
playsinline
webkit-playsinline
crossorigin="anonymous"
preload="auto">
</video>

<img id="petal" src="petal.png">
<img id="bg" src="bg.jpeg">

</a-assets>

<a-camera position="0 1.6 0"></a-camera>

<!-- BACKGROUND -->
<a-sky src="#bg" rotation="0 -90 0"></a-sky>

<!-- LIGHTING -->
<a-light type="ambient" intensity="1.2"></a-light>
<a-light type="point" position="0 3 -2" intensity="2"></a-light>

<!-- VIDEO -->
<a-entity id="container" position="0 1.6 -3">

<a-video
src="#video"
width="1.5"
height="2.7"
material="shader: flat">
</a-video>

</a-entity>

<!-- 🎯 AR PLAY/PAUSE BUTTON -->
<a-entity id="uiBtn" position="0 0.3 -2.4">

  <!-- BUTTON BACKGROUND -->
  <a-circle
    id="pauseBtn"
    class="clickable"
    radius="0.22"
    color="#ffffff"
    opacity="0.6">
  </a-circle>

  <!-- PLAY ICON -->
  <a-triangle
    id="playIcon"
    class="clickable"
    visible="false"
    color="#000"
    vertex-a="0 0.08 0"
    vertex-b="-0.06 -0.08 0"
    vertex-c="0.06 -0.08 0"
    position="0 0 0.01">
  </a-triangle>

  <!-- PAUSE ICON (2 bars) -->
  <a-box
    id="bar1"
    class="clickable"
    width="0.04"
    height="0.12"
    depth="0.01"
    color="#000"
    position="-0.05 0 0.01">
  </a-box>

  <a-box
    id="bar2"
    class="clickable"
    width="0.04"
    height="0.12"
    depth="0.01"
    color="#000"
    position="0.05 0 0.01">
  </a-box>

</a-entity>

<!-- PETALS -->
<a-entity id="petals"></a-entity>

</a-scene>

<script>

/* ELEMENTS */
const video = document.querySelector("#video");
const overlay = document.querySelector("#overlay");
const scene = document.querySelector("#scene");

const arBtn = document.querySelector("#arBtn");
const webBtn = document.querySelector("#webBtn");

/* AR START */
arBtn.onclick = async () => {

  overlay.style.display = "none";
  scene.setAttribute("visible", "true");

  try {
    video.muted = true;
    await video.play();

    setTimeout(() => {
      video.muted = false;
    }, 500);

  } catch (e) {
    alert("Tap again to start video");
  }

};

/* WEBSITE */
webBtn.onclick = () => {
  window.open("https://s-weds-r.my.canva.site/", "_blank");
};

/* 🎯 PLAY / PAUSE CONTROL */
const pauseBtn = document.querySelector("#pauseBtn");
const pauseIcon = document.querySelector("#pauseIcon");

function toggleVideo(){

  if(video.paused){
    video.play();
    pauseIcon.setAttribute("value", "❚❚");
  } else {
    video.pause();
    pauseIcon.setAttribute("value", "▶");
  }

}

pauseBtn.addEventListener("click", toggleVideo);
pauseIcon.addEventListener("click", toggleVideo);

/* PETALS */
const petals = document.querySelector("#petals");

for(let i=0;i<35;i++){

  let p = document.createElement("a-image");

  p.setAttribute("src","#petal");
  p.setAttribute("scale","0.15 0.15 0.15");

  p.setAttribute("position",{
    x:(Math.random()*4)-2,
    y:3+Math.random()*2,
    z:-2-Math.random()*2
  });

  p.setAttribute("animation",{
    property:"position",
    to:`${(Math.random()*3)-1.5} -1 ${-2-Math.random()*2}`,
    dur:4000+Math.random()*2000,
    loop:true
  });

  p.setAttribute("animation__spin",
    "property: rotation; to: 0 360 360; dur: 3000; loop: true"
  );

  petals.appendChild(p);
}

</script>

</body>
</html>
